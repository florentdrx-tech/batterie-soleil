name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer le SDK Android
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compiler
        run: gradle assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk SoleilBatterie.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoleilBatterie
          path: SoleilBatterie.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Soleil & Batterie 1.0.${{ github.run_number }}
          files: SoleilBatterie.apk
          make_latest: true
